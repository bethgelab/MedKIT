alg_name: "DenseRAG"
model_name: "AdaptLLM/medicine-chat"
device: 0
top_k: 3
retrieve_target: false
similarity_metric: "cosine"
exact_match: false
solver: "HNSW"
solver_args:
  hnsw_m: 32
  hnsw_efConstruction: 200
  hnsw_efSearch: 64
  gpu: false
sentence_model_name: "NeuML/pubmedbert-base-embeddings"
max_length: 768
# AdaptLLM-Medicine-Chat inherits Llama-2-7B's 4096 context window; override
# the vLLM default (8192) to prevent a ValueError at engine init.
vllm_max_model_len: 4096
model_parallel: true
batch_size: 1

max_out_len_closed: 50
max_out_len_open: 1024
