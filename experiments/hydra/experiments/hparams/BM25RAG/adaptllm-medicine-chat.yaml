alg_name: "BM25RAG"
model_name: "AdaptLLM/medicine-chat"
device: 0
top_k: 1
retrieve_target: false
max_length: 768
# AdaptLLM-Medicine-Chat inherits Llama-2-7B's 4096 context window; override
