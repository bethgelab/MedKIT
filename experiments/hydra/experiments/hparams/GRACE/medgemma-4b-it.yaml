alg_name: "GRACE"
model_name: "google/medgemma-4b-it"
device: 0
model_parallel: true

inner_params:
# Gemma 3 is multimodal: AutoModelForCausalLM returns Gemma3ForConditionalGeneration,
# so the text transformer sits at model.language_model.layers, not model.layers.
- model.language_model.layers[28].mlp.down_proj.weight

edit_lr: 1.0
n_iter: 100
eps: 0.5
dist_fn: euc # euc, mmd, cos
val_init: cold # cold, warm
val_train: sgd # sgd, pert
val_reg: None
reg: early_stop
replacement: replace_last # replace_last, replace_all, replace_prompt
eps_expand: coverage
num_pert: 8
dropout: 0.0
max_length: 768
