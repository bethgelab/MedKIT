alg_name: "AlphaEdit"
model_name: "google/gemma-3-4b-it"
stats_dir: "./data/stats"
device: 0
layers: [6]
layer_selection: "all"
fact_token: "subject_last"
v_num_grad_steps: 25
v_lr: 1.0
v_loss_layer: 33
v_weight_decay: 1e-3
clamp_norm_factor: 2
kl_factor: 0.0625
mom2_adjustment: true
mom2_update_weight: 200000
rewrite_module_tmp: "model.layers.{}.mlp.down_proj"
layer_module_tmp: "model.layers.{}"
mlp_module_tmp: "model.layers.{}.mlp"
attn_module_tmp: "model.layers.{}.self_attn"
ln_f_module: "model.norm"
lm_head_module: "lm_head"
mom2_dataset: "wikipedia"
mom2_n_samples: 100000
mom2_dtype: "float32"
nullspace_threshold: "rel_max:1e-2"
L2: 1e-3
P_loc: "./data/alphaedit/null_space_project_gemma-3-4b-it_float32.pt"
model_parallel: true
max_length: 768
