# @package _global_
# AUTO-GENERATED by main_experiments/generate_oob_configs.py — do not edit by hand.
# OOB (out-of-the-box) eval of the unedited base model on the full dataset.
# Produces the canonical "pre" baseline for analysis.
defaults:
  - /wandb: wandb
  - /hparams: OracleRAG/llama3.1-8b
  - _self_

wandb:
  notes: "OOB eval — unedited base model — llama31_8b"
  tags: ['main_sweep_v4', 'main', 'oob', 'llama31_8b']

experiment: "hemonc/main/oob_eval/llama31_8b"
debug: false

editing_method: 'EVAL'
data_dir: 'data'
ds_size: -1
ds_seed: 42
metrics_save_dir: 'metrics/main'
batch_size: 1
max_minibatch_size: 32

adapter_path: ''
use_vllm: true
eval_use_vllm: false
eval_use_vllm_sleep_mode: false
vllm_eval_gpu_memory_utilization: 0.90
vllm_eval_max_model_len: 2048
eval_gen_batch_size: 8
attn_implementation: auto

checkpoint:
  save: false
  load: false
  save_dir: 'checkpoints/main'
  keep_milestones: []

qa:
  model: 'gpt-4o-mini-hemonc'
  judge_model: 'gpt-4o-hemonc'
  judge_workers: 8
  judge_enabled: true
  fs_examples: false
  past_eval: false
  base_eval: false
  data_format: csv
  data_path: 'hf://bethgelab/MedKIT'  # or a local CSV built with data_construction/
  include_evidence: false
  modes:
    - null
  modes_combine: mix
  # the entry script only auto-populates `increments` when strategy != 'none'.
  # For OOB we want a single pass over the whole dataset, so hardcode the
  # sentinel label ('hemonc_full') that hemonc_batching uses internally for
  # the 'none' strategy — matches the filter_by_increment no-op path.
  increments:
    - 'hemonc_full'
  filter_edits: false
  filter_conflicting_edits: true
  skip_pre_edit: false
  batching:
    strategy: none        # single batch with the full dataset
    crop_year: 2025
    n_increments: null
